name: 'football_scout'
version: '1.0.0'
config-version: 2
profile: 'football_scout'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  football_scout:
    staging:
      # TABLES, not views. Deliberate: staging reads an ATTACHED read-only
      # database (`tm`), so a view over it fails for any consumer that has not
      # attached it - the Streamlit app included. Materialising costs a little
      # disk and makes data/scout.duckdb fully self-contained and portable.
      +materialized: table
    intermediate:
      +materialized: table
    marts:
      +materialized: table

# ---------------------------------------------------------------------------
# ALL TUNABLE PARAMETERS LIVE HERE. Never hard-code these in a model.
# Override at runtime:  dbt build --vars '{max_market_value_eur: 3000000}'
# ---------------------------------------------------------------------------
vars:
  # -- as-of date. Drives contract maths and "current" season. Overridden by
  #    the backtest harness in Phase 3 to rebuild features at a past date.
  as_of_date: '2026-09-04'

  # -- the season to score on (season = year the campaign started)
  reference_season: 2025

  # -- price filter. TM value != fee; fees for prospects run ~1.5-2.5x TM value,
  #    so cap TM value below the true budget.
  max_market_value_eur: 4000000
  fee_multiplier: 1.8

  # -- eligibility
  max_age: 23
  min_minutes: 900
  min_minutes_if_trending: 600

  # -- who gets scored at all. Goalkeepers have no metrics in the free data;
  #    defenders have no DEFENSIVE metrics, so Phase 1 ranked them on attacking
  #    output they are not paid to produce - 42 of 105 had zero goal
  #    contributions. Drop 'Defender' from this list to score them anyway.
  excluded_position_groups: ['Goalkeeper', 'Defender']

  # -- age curve. A LOGISTIC DECAY, not a gaussian around peak age.
  #    The gaussian (peak_age 25.5) was a bug: inside an age<=23 filter every
  #    player sits on its rising side, so it scored 23-year-olds 43 points ABOVE
  #    18-year-olds - the opposite of SPEC 5.3's "reward 18-23, penalise 26+".
  #    midpoint = the age scoring 0.5; steepness = years per unit of decay.
  age_midpoint: 24.5
  age_steepness: 1.5

  # -- contract runway curve. Continuous, replacing four coarse buckets that put
  #    45% of the shortlist on one value. Months at which the score is 0.5.
  contract_midpoint_months: 24.0
  contract_steepness_months: 8.0
  contract_unknown_score: 0.40

  # -- composite weights (need not sum to 1; normalised in the model)
  w_performance: 0.45
  w_trajectory: 0.35
  w_availability: 0.20

  # -- entity resolution health. SPEC 4.2 makes coverage THE metric for this
  #    layer: without a failing test it rots silently as names drift upstream.
  understat_fuzzy_threshold: 90
  understat_coverage_min_pct: 90
  understat_coverage_min_minutes: 600

  # -- contract leverage thresholds, in months remaining
  contract_leverage_months: 18
  contract_bargain_months: 12
