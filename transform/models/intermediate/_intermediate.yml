version: 2
models:
  - name: int_player_season
    description: >
      Player x season x competition totals for EVERY competition - nothing is
      filtered here. competition_type / competition_sub_type / is_domestic_league
      describe each row so downstream models can pick their own sample.
    columns:
      - name: is_domestic_league
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_id, season, competition_id]
  - name: int_player_value_history
    columns:
      - name: player_id
        tests: [unique, not_null]
  - name: int_contract_status
    columns:
      - name: player_id
        tests: [unique, not_null]
  - name: int_player_identity
    config:
      # Surfaces the project var to the Python model - dbt.config.get() reads
      # model config, not vars, so without this the var would sit unused and
      # the threshold would silently stay at the in-code default.
      fuzzy_threshold: "{{ var('understat_fuzzy_threshold') }}"
    description: >
      Understat -> Transfermarkt player map, one row per understat_player_id.
      Built by a Python model because the fuzzy passes need rapidfuzz. See
      int_player_identity.py for the four-pass strategy and why the constraint
      is league+season rather than club+season.
    columns:
      - name: understat_player_id
        tests: [unique, not_null]
      - name: player_id
        description: >
          Unique as well as not-null: two Understat players resolving to one
          Transfermarkt player means at least one is a namesake collision, and
          a wrong match injects another player's xG.
        tests: [unique, not_null]
      - name: match_method
        tests:
          - accepted_values:
              arguments:
                values: ['exact_name_league_season', 'fuzzy_name_league_season',
                         'fuzzy_name_birth_year', 'manual_override']
