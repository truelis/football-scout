version: 2

models:
  - name: dim_player
    description: >
      Current player profile as of var('as_of_date'). This is the FULL upstream
      universe - every player the dataset has ever carried, including retirees
      going back to the 1960s. It is not the scouting population; do not assert
      scouting-population properties here.
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: age
        description: >
          Bounded below by ZERO, not by a playing age, and with no ceiling at all.
          Both limits are deliberate and both were learned the hard way.

          A ceiling rots on a timer: 104 retired players are already over 50
          (oldest born 1968) and each ages by a year every time as_of_date
          advances. A floor of 14 looks sensible until the backtest rebuilds at a
          past date, when 286 future professionals are legitimately children -
          not corrupt data, just people who had not debuted yet. This model is
          deliberately the FULL historical universe, so the only thing it can
          honestly assert is that nobody was born after as_of_date.

          The scouting-population assertion (14-50, not null) lives on
          mart_player_scores, where every row has cleared a minutes threshold and
          is therefore genuinely a professional at that date. Nulls pass here: 49
          players have no DOB upstream and accepted_range ignores nulls, so this
          is not a completeness check.
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}

  - name: fct_player_season
    description: >
      The complete player x season x competition record - domestic leagues,
      cups and European ties alike. Nothing is filtered out; is_domestic_league
      marks which rows belong in a scoring sample, and tier/strength_coef are
      null for the rest because a cup has no league strength.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_id, season, competition_id]
    columns:
      - name: is_domestic_league
        description: >
          True for first-tier domestic league rows - the scoring sample. Cup and
          European rows are kept in this model on purpose (level progression and
          squad role are Phase 2-3 signals) but are excluded by
          mart_player_scores, which must not pool them into a per-90 rate.
        tests: [not_null]

  - name: mart_player_scores
    description: >
      Three-axis scores with all inputs retained. One row per eligible player
      for the reference season.
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: age
        description: >
          The scouting-population age assertion, moved here from dim_player where
          it was being applied to the whole historical archive. Every scored
          player has cleared the minutes threshold in the reference season, so a
          plausible playing age is a real invariant here rather than an
          assumption about an archive.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 14, max_value: 50}
      - name: performance_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: availability_score
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: confidence
        description: >
          high = scored on npxG+xA (Understat covers his league); medium =
          scored on goal contributions only; low = position with no usable
          metric in the free data.
        tests:
          - accepted_values:
              arguments: {values: ['high', 'medium', 'low']}
      - name: performance_basis
        tests:
          - accepted_values:
              arguments: {values: ['npxg_xa_per90', 'goal_contributions_per90']}

  - name: fct_player_valuations
    description: Market value time series per player, for the app's value chart.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_id, valuation_date]

  - name: mart_shortlist
    description: Filtered, ranked shortlist. The app's landing table.
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: composite_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
