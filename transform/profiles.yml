# The project's own profile, and the only one - this file is authoritative.
#
# dbt resolves profiles in this order:
#     --profiles-dir flag  >  DBT_PROFILES_DIR  >  current directory  >  ~/.dbt
#
# Because dbt commands are run from `transform/`, the third rule picks this file
# up. That only works while DBT_PROFILES_DIR is unset: it used to be exported in
# ~/.zshrc, which silently overrode this file and sent dbt to ~/.dbt instead.
# It was redundant - dbt already falls back to ~/.dbt on its own - so it was
# removed, and the sibling dbt projects in this workspace still resolve normally.
#
# Keeping the profile in the repo means it travels with the project: a fresh
# clone on another laptop needs no ~/.dbt setup at all.
football_scout:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to the dbt working directory, i.e. transform/.
      path: ../data/scout.duckdb
      threads: 4
      # Attach the downloaded transfermarkt-datasets file READ-ONLY.
      # We never write to it; refreshing the data = re-downloading the file.
      attach:
        - path: ../data/transfermarkt-datasets.duckdb
          alias: tm
          read_only: true

    # Backtest target: a SEPARATE DuckDB file so rebuilding the world at a past
    # as_of_date never overwrites the live warehouse the app reads.
    backtest:
      type: duckdb
      path: ../data/backtest.duckdb
      threads: 4
      attach:
        - path: ../data/transfermarkt-datasets.duckdb
          alias: tm
          read_only: true
