[project]
name = "football-scout"
version = "0.1.0"
description = "Local football scouting tool: find undervalued young players"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "httpx>=0.27",
    "pandas>=2.2",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pyyaml>=6.0",
]

[tool.uv]
dev-dependencies = ["ruff>=0.7", "pytest>=8.0"]
