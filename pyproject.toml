[project]
name = "football-scout"
version = "0.1.0"
description = "Local football scouting tool: find undervalued young players"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "httpx>=0.27",
    "pandas>=2.2",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
    "sqlfluff>=4.3.0",
    "sqlfluff-templater-dbt>=4.3.0",
    "pre-commit>=4.6.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so the ruleset does not drift with ruff releases.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "BLE"]
ignore = [
    "E501",  # line length is the formatter's job, not the linter's
]
