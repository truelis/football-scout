# Local Airflow for the football-scout refresh.
#
# LocalExecutor, NOT CeleryExecutor. Celery exists to distribute tasks across
# worker machines; this pipeline runs weekly on one laptop, so Celery would add
# Redis, a worker container and a broker to solve a problem we do not have.
# LocalExecutor still runs tasks in parallel via subprocesses, which is all the
# parallelism three independent downloads can use.
#
#   docker compose up -d        start
#   docker compose down         stop
#   docker compose down -v      stop and wipe Airflow's metadata DB
#
# UI: http://localhost:8080
---
x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API__EXPOSE_CONFIG: "true"
    # Our tasks shell out to project scripts; this is where they live in-container.
    PROJECT_DIR: /opt/project
    PYTHONPATH: /opt/project
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    # The PROJECT ITSELF, read-write: tasks download into data/, and dbt writes
    # data/scout.duckdb. Mounting the repo rather than copying it means a DAG run
    # always uses the working tree, and the Streamlit app on the host reads the
    # very same DuckDB file the pipeline just rebuilt.
    - ../:/opt/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Local --lastname Dev --role Admin \
          --email dev@localhost || true
    environment:
      <<: *airflow-common-env
    user: "0:0"

volumes:
  postgres-db-volume:
