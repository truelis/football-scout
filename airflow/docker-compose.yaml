# Local Airflow for the football-scout refresh.
#
# LocalExecutor, NOT CeleryExecutor. Celery exists to distribute tasks across
# worker machines; this pipeline runs weekly on one laptop, so Celery would add
# Redis, a worker container and a broker to solve a problem we do not have.
# LocalExecutor still runs tasks in parallel via subprocesses, which is all the
# parallelism three independent downloads can use.
#
#   docker compose up -d        start
#   docker compose down         stop
#   docker compose down -v      stop and wipe Airflow's metadata DB
#
# UI: http://localhost:8080
---
x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API__EXPOSE_CONFIG: "true"
    # Airflow 3 runs tasks against a Task Execution API rather than letting them
    # touch the metadata DB directly. Workers must be told where that API lives:
    # the default assumes localhost, which inside the scheduler container is the
    # scheduler itself, so every task dies with
    #     httpx.ConnectError: [Errno 111] Connection refused
    # after exhausting its retries. This is new in 3.x and not needed in 2.x.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # The scheduler SIGNS a JWT that the task uses to call that API, and the
    # apiserver VERIFIES it. Without a shared secret each service invents its own
    # at startup, so every task dies with
    #     ServerResponseError: Invalid auth token
    # Local-only value; generate a real one for anything that leaves this laptop.
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-local-dev-not-a-real-secret}"
    # Airflow 3 replaced FAB with SimpleAuthManager by default, so the old
    # `airflow users create` no longer exists. For a stack that only ever listens
    # on localhost, skipping login entirely is simpler and no less secure than a
    # hardcoded airflow/airflow. Do NOT carry this to anything reachable.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Our tasks shell out to project scripts; this is where they live in-container.
    PROJECT_DIR: /opt/project
    # NO PYTHONPATH=/opt/project. The repo has an `airflow/` directory at its
    # root, so putting it on the path makes `import airflow` resolve to OUR
    # folder as a namespace package and shadow the real install. The symptom is
    # ModuleNotFoundError: No module named 'airflow.__main__' - which points at
    # the image, not at a path collision, and cost a rebuild to find.
    # Tasks invoke scripts by absolute path, so nothing needs it.
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    # The PROJECT ITSELF, read-write: tasks download into data/, and dbt writes
    # data/scout.duckdb. Mounting the repo rather than copying it means a DAG run
    # always uses the working tree, and the Streamlit app on the host reads the
    # very same DuckDB file the pipeline just rebuilt.
    - ../:/opt/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    # NO entrypoint override. The image's entrypoint is what wires up the
    # environment when the container runs as a remapped host UID rather than the
    # image's own airflow user - bypassing it with `entrypoint: /bin/bash` leaves
    # Python unable to find the airflow package at all. Every other service here
    # passes a bare subcommand for the same reason.
    command: db migrate
    environment:
      <<: *airflow-common-env
    # NOT root. The official compose runs init as 0:0 to chown mounted dirs, but
    # Airflow is installed under /home/airflow/.local and root does not see it -
    # the symptom is ModuleNotFoundError: No module named 'airflow.__main__',
    # which reads like a broken image rather than a wrong user.

volumes:
  postgres-db-volume:
